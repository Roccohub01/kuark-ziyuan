const CAT_COLORS={"AI/人工智能":"var(--cat-ai)","短视频/直播":"var(--cat-video)","健身/健康":"var(--cat-health)","儿童/幼儿":"var(--cat-kids)","商业/管理":"var(--cat-biz)","心理/成长":"var(--cat-psych)","教育/课程":"var(--cat-edu)","生活/休闲":"var(--cat-life)","电商/创业":"var(--cat-shop)","职场/技能":"var(--cat-work)","英语/外语":"var(--cat-lang)","读书/听书":"var(--cat-book)","音乐/影视":"var(--cat-music)","其他":"var(--cat-other)"};

let currentCat="全部",searchTerm="";

function getCategories(){
  const s=new Set();DATA.forEach(r=>{if(r.c)s.add(r.c)});return["全部",...Array.from(s)];
}

function init(){
  // Stats
  const cats=new Set(DATA.map(r=>r.c));
  const dates=[...new Set(DATA.map(r=>r.d).filter(Boolean))].sort().reverse();
  document.getElementById("stats").innerHTML=`
    <div class="stat-item"><div class="stat-num">${DATA.length}</div><div class="stat-label">资源总数</div></div>
    <div class="stat-item"><div class="stat-num">${cats.size}</div><div class="stat-label">分类</div></div>
    <div class="stat-item"><div class="stat-num">${dates.length}</div><div class="stat-label">更新天数</div></div>
  `;
  // Categories
  const catEl=document.getElementById("categories");
  catEl.innerHTML=getCategories().map(c=>`<button class="cat-btn${c===currentCat?' active':''}" data-cat="${c}">${c}</button>`).join("");
  catEl.addEventListener("click",e=>{const b=e.target.closest(".cat-btn");if(!b)return;currentCat=b.dataset.cat;catEl.querySelectorAll(".cat-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()});
  // Search
  document.getElementById("searchInput").addEventListener("input",e=>{searchTerm=e.target.value.trim().toLowerCase();render()});
  render();
}

function getFiltered(){
  let list=DATA;
  if(currentCat!=="全部")list=list.filter(r=>r.c===currentCat);
  if(searchTerm)list=list.filter(r=>r.n.toLowerCase().includes(searchTerm)||r.c.toLowerCase().includes(searchTerm));
  return list;
}

function render(){
  const list=getFiltered();
  const main=document.getElementById("main");
  if(!list.length){main.innerHTML='<div class="empty-state"><div class="icon">&#128533;</div><p>没有找到匹配的资源，换个关键词试试</p></div>';return}
  // Group by date
  const dated=list.filter(r=>r.d);
  const undated=list.filter(r=>!r.d);
  const groups={};
  dated.forEach(r=>{if(!groups[r.d])groups[r.d]=[];groups[r.d].push(r)});
  if(undated.length)groups["分类精选"]=undated;
  const sortedKeys=Object.keys(groups).sort((a,b)=>{
    if(a==="分类精选")return 1;if(b==="分类精选")return -1;
    return b.localeCompare(a);
  });
  let html="";
  sortedKeys.forEach(date=>{
    const items=groups[date];
    html+=`<section class="date-section"><div class="date-header">${date==="分类精选"?'&#127775; 分类精选':'&#128197; '+date}<span class="badge">${items.length} 项</span></div><div class="resources-grid">`;
    items.forEach(r=>{
      const color=CAT_COLORS[r.c]||"var(--cat-other)";
      html+=`<div class="resource-card"><span class="cat-tag" style="background:${color}">${r.c}</span><div class="info"><div class="name">${escHtml(r.n)}</div></div><a href="${r.u}" target="_blank" rel="noopener" class="link-btn">夸克网盘</a></div>`;
    });
    html+=`</div></section>`;
  });
  main.innerHTML=html;
}

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

document.addEventListener("DOMContentLoaded",init);
</script>
